<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<title>Bảng Điểm Hoa - Thế Giới Hoa Viên</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 12px;
    background: #f9c9d6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  .card {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 24px;
    padding: 32px 24px 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  h1 {
    text-align: center;
    color: #e6247a;
    font-size: 2rem;
    line-height: 1.3;
    margin: 0 0 8px;
  }
  .emoji-divider {
    text-align: center;
    font-size: 1.8rem;
    margin-bottom: 4px;
  }
  .count {
    text-align: center;
    color: #b95a83;
    font-size: 0.9rem;
    margin-bottom: 16px;
  }
  #search {
    display: block;
    width: 100%;
    padding: 14px 18px;
    font-size: 1rem;
    border: 2px solid #f4b6cd;
    border-radius: 14px;
    outline: none;
    margin-bottom: 12px;
  }
  #search:focus {
    border-color: #e6247a;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .filter-btn {
    border: 2px solid #f4b6cd;
    background: #fff;
    color: #7a1240;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
  }
  .filter-btn.active {
    background: #e6247a;
    border-color: #e6247a;
    color: #fff;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    overflow: hidden;
    border-radius: 16px;
  }
  thead th {
    background: #f4a9c4;
    color: #7a1240;
    font-size: 1rem;
    padding: 16px 10px;
    text-align: left;
  }
  thead th:nth-child(3),
  thead th:nth-child(4) {
    text-align: center;
  }
  tbody td {
    padding: 10px;
    border-bottom: 1px solid #f3e2e8;
    vertical-align: middle;
  }
  tbody tr:last-child td {
    border-bottom: none;
  }
  tbody tr:hover {
    background: #fff5f8;
  }
  .thumb {
    width: 60px;
    height: 80px;
    border-radius: 10px;
    border: 2px solid #f4b6cd;
    overflow: hidden;
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .name {
    font-weight: 700;
    color: #222;
  }
  .score {
    text-align: center;
    font-weight: 700;
    color: #e6247a;
    white-space: nowrap;
  }
  .quality {
    text-align: center;
    font-weight: 700;
  }
  .quality.orange { color: #d9791e; }
  .quality.purple { color: #8e3fd6; }
  .quality.blue { color: #2f7de1; }
  .quality.green { color: #2e9e4f; }
  .quality.red { color: #d32f3c; }
  .quality.gold { color: #b8860b; }
  .empty {
    text-align: center;
    color: #999;
    padding: 24px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🌸 Bảng Điểm Hoa - Thế Giới Hoa Viên</h1>
    <div class="emoji-divider">🌸</div>
    <div class="count" id="count"></div>
    <input id="search" type="text" placeholder="Nhập tên hoa để tìm kiếm...">
    <div class="filters" id="filters">
      <button class="filter-btn active" data-q="all">Tất cả</button>
      <button class="filter-btn" data-q="Cam">Cam</button>
      <button class="filter-btn" data-q="Tím">Tím</button>
      <button class="filter-btn" data-q="Xanh Dương">Xanh Dương</button>
      <button class="filter-btn" data-q="Xanh Lá">Xanh Lá</button>
      <button class="filter-btn" data-q="Đỏ">Đỏ</button>
      <button class="filter-btn" data-q="Vàng">Vàng</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Hình ảnh</th>
          <th>Tên Hoa</th>
          <th>Điểm số</th>
          <th>Phẩm chất (Màu)</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <div id="empty-msg" class="empty" style="display:none;">Không tìm thấy hoa phù hợp.</div>
  </div>

<script>
  const QUALITY_CLASS = {
    "Cam": "orange",
    "Tím": "purple",
    "Xanh Dương": "blue",
    "Xanh Lá": "green",
    "Đỏ": "red",
    "Vàng": "gold"
  };

  const flowers = JSON.parse(document.getElementById("flower-data").textContent);

  const tbody = document.getElementById("table-body");
  const emptyMsg = document.getElementById("empty-msg");
  const searchInput = document.getElementById("search");
  const countEl = document.getElementById("count");
  const filterBtns = document.querySelectorAll(".filter-btn");
  let activeQuality = "all";

  function render(list) {
    tbody.innerHTML = "";
    countEl.textContent = `Tổng cộng: ${list.length} / ${flowers.length} loại hoa`;
    if (list.length === 0) {
      emptyMsg.style.display = "block";
      return;
    }
    emptyMsg.style.display = "none";
    const frag = document.createDocumentFragment();
    list.forEach(f => {
      const tr = document.createElement("tr");

      const tdImg = document.createElement("td");
      const thumb = document.createElement("div");
      thumb.className = "thumb";
      const img = document.createElement("img");
      img.src = f.img;
      img.alt = f.name;
      img.loading = "lazy";
      thumb.appendChild(img);
      tdImg.appendChild(thumb);

      const tdName = document.createElement("td");
      tdName.className = "name";
      tdName.textContent = f.name;

      const tdScore = document.createElement("td");
      tdScore.className = "score";
      tdScore.textContent = "+" + f.score;

      const tdQuality = document.createElement("td");
      tdQuality.className = "quality " + (QUALITY_CLASS[f.quality] || "");
      tdQuality.textContent = f.quality;

      tr.appendChild(tdImg);
      tr.appendChild(tdName);
      tr.appendChild(tdScore);
      tr.appendChild(tdQuality);
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
  }

  function sortByScoreDesc(list) {
    return [...list].sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, "vi"));
  }

  function applyFilters() {
    const q = searchInput.value.trim().toLowerCase();
    let filtered = flowers.filter(f => f.name.toLowerCase().includes(q));
    if (activeQuality !== "all") {
      filtered = filtered.filter(f => f.quality === activeQuality);
    }
    render(sortByScoreDesc(filtered));
  }

  searchInput.addEventListener("input", applyFilters);

  filterBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      filterBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeQuality = btn.dataset.q;
      applyFilters();
    });
  });

  applyFilters();
</script>
